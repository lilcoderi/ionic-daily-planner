<ion-header>
  <ion-toolbar>
    <ion-title>Notes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="add-notes-container">
    <ion-button class="small-button" (click)="goToAddNotes()">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Add Notes
    </ion-button>
  </div>

  <ion-list>
    <ion-item *ngFor="let note of notes" (click)="goToNoteDetails(note.id)">
      <ion-label>
        <h2>{{ note.title }}</h2>
        <p>{{ note.description }}</p>
        <p>{{ note.date | date:'medium' }}</p> <!-- Use Angular date pipe for formatting -->
      </ion-label>
      <ion-icon
        name="create-outline"
        slot="end"
        (click)="goToEditNote(note.id, $event)"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
